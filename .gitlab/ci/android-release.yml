# Reusable GitLab CI templates for Android release pipelines.
#
# Consumers include this file together with `.gitlab/ci/android.yml`, then define
# concrete jobs with `extends`.

.magisk_android_release_tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - when: never

.magisk_android_release_owner_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab"'
    - when: never

.magisk_linux_base:
  image: "debian:trixie-slim"
  variables:
    GET_SOURCES_ATTEMPTS: "3"
    MAGISK_CI_TOOLKIT_DIR: "$CI_PROJECT_DIR/.magisk-ci-toolkit"
    MAGISK_CI_TOOLKIT_REPOSITORY: "https://gitlab.com/magisk3171/shared/magisk-ci-toolkit.git"
    MAGISK_LINUX_APT_PACKAGES: ""
    MAGISK_OTEL_EXPORT: "1"
    MAGISK_OTEL_SERVICE_NAME: "magisk-ci"
    MAGISK_OTEL_ENDPOINT: "https://136325658.otel.gitlab-o11y.com:14318/v1/traces"
  hooks:
    pre_get_sources_script:
      - git config --global http.version "HTTP/1.1"
  cache: []
  before_script:
    - |
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [[ "$use_mirror" == "true" && ! -s /etc/ssl/certs/ca-certificates.crt ]]; then
        # debian:trixie-slim needs a one-time CA bootstrap before HTTPS mirrors work.
        apt-get -o APT::Update::Error-Mode=any update
        apt-get install -y --no-install-recommends ca-certificates
        rm -rf /var/lib/apt/lists/*
      fi
      if [[ "$use_mirror" == "true" ]]; then
        sed -i \
          -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
          -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      fi
      if [[ "$use_mirror" == "true" ]]; then
        if ! apt-get -o APT::Update::Error-Mode=any update; then
          echo "Mirror apt-get update failed, falling back to official sources" >&2
          sed -i \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get -o APT::Update::Error-Mode=any update
        fi
      else
        apt-get -o APT::Update::Error-Mode=any update
      fi
      apt_packages=(bash ca-certificates curl git openssl python3)
      for package in $MAGISK_LINUX_APT_PACKAGES; do
        apt_packages+=("$package")
      done
      apt-get install -y --no-install-recommends "${apt_packages[@]}"
      rm -rf /var/lib/apt/lists/*

      chmod +x scripts/resolve_ci_toolkit.sh
      bash scripts/resolve_ci_toolkit.sh >/dev/null
  after_script:
    - |
      set +e
      if [ -x "${MAGISK_CI_TOOLKIT_DIR:-}/ci/otel_export.sh" ]; then
        bash "$MAGISK_CI_TOOLKIT_DIR/ci/otel_export.sh" "ci.job" \
          "magisk.toolkit_ref=${MAGISK_CI_TOOLKIT_REF:-}" \
          "magisk.span_source=linux_base_after_script"
      else
        echo "otel: helper missing, skip"
      fi

.magisk_android_release_guard:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_tag_rules
  stage: release
  script:
    - |
      set -euo pipefail
      chmod +x scripts/release/check_release_guard.sh
      scripts/release/check_release_guard.sh "$CI_COMMIT_TAG"

# ---------------------------------------------------------------------------
# Release template contract. The shared repo declares WHAT a project must
# provide, never the value itself - the values are project-specific.
#
#   MAGISK_ANDROID_RELEASE_APK_TASKS / _AAB_TASKS   required  gradle task list,
#                                                             e.g. ":app:assembleRelease"
#   MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS        optional  extra -P/system props
#   MAGISK_ANDROID_RELEASE_APK_ROOTS                optional  default "app/build/outputs/apk"
#   MAGISK_ANDROID_RELEASE_KEYSTORE_PATH            optional  default "$CI_PROJECT_DIR/release.jks"
#   MAGISK_ANDROID_RELEASE_INJECT_VERSION           optional  default "true"
#
# The keystore lives at the repository root because that is the first path the
# shared signing convention plugin looks at (release.jks, then app/release.jks).
# ---------------------------------------------------------------------------
.magisk_android_release_apk:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  stage: release
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${MAGISK_ANDROID_RELEASE_APK_TASKS:?MAGISK_ANDROID_RELEASE_APK_TASKS is required (the gradle task list is project-specific, e.g. ':app:assembleRelease')}"
      : "${MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS:=}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      keystore_path="${MAGISK_ANDROID_RELEASE_KEYSTORE_PATH:-$CI_PROJECT_DIR/release.jks}"
      mkdir -p "$(dirname "$keystore_path")"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"

      # One version source for every release build: resolve the Play decision
      # (versionName from gradle/libs.versions.toml, versionCode from the Play
      # track) and inject it into gradle. play-release.env carries the same
      # numbers downstream so no job has to re-derive them.
      # Opt out with MAGISK_ANDROID_RELEASE_INJECT_VERSION=false.
      MAGISK_ANDROID_RELEASE_VERSION_ARGS=""
      if [[ "${MAGISK_ANDROID_RELEASE_INJECT_VERSION:-true}" == "true" ]]; then
        : "${MAGISK_ANDROID_RELEASE_PACKAGE_NAME:?MAGISK_ANDROID_RELEASE_PACKAGE_NAME is required to resolve the release version}"
        bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
          --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
          --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
          --output "$CI_PROJECT_DIR/play-release.env" \
          --initial-version-code "${MAGISK_PLAY_INITIAL_VERSION_CODE:-0}"
        set -a
        # shellcheck disable=SC1091
        . "$CI_PROJECT_DIR/play-release.env"
        set +a
        MAGISK_ANDROID_RELEASE_VERSION_ARGS="-PversionName=${MAGISK_PLAY_VERSION_NAME:-} -PversionCode=${MAGISK_PLAY_VERSION_CODE:-}"
      fi
      KEYSTORE_FILE="$keystore_path" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS $MAGISK_ANDROID_RELEASE_VERSION_ARGS $MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS $MAGISK_ANDROID_RELEASE_APK_TASKS
      chmod +x "$MAGISK_CI_TOOLKIT_DIR/release/validate_android_apk_signatures.sh"
      MAGISK_ANDROID_RELEASE_APK_ROOTS="${MAGISK_ANDROID_RELEASE_APK_ROOTS:-app/build/outputs/apk}" \
        bash "$MAGISK_CI_TOOLKIT_DIR/release/validate_android_apk_signatures.sh"
  artifacts:
    name: "android-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - "*/build/outputs/apk/**/release/*.apk"
      - "*/build/outputs/mapping/**/mapping.txt"
      - "*/build/outputs/native-debug-symbols/**/*.zip"
      - play-release.env

.magisk_android_release_aab:
  extends:
    - .magisk_android_base
    - .magisk_android_release_tag_rules
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true"'
    - when: never
  script:
    - |
      set -euo pipefail
      : "${MAGISK_GRADLE_ARGS:=--warning-mode all}"
      : "${MAGISK_ANDROID_RELEASE_AAB_TASKS:?MAGISK_ANDROID_RELEASE_AAB_TASKS is required (the gradle task list is project-specific, e.g. ':app:bundleRelease')}"
      : "${MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS:=}"
      : "${RELEASE_KEYSTORE:?RELEASE_KEYSTORE is required}"
      : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
      : "${KEY_ALIAS:?KEY_ALIAS is required}"
      : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

      keystore_path="${MAGISK_ANDROID_RELEASE_KEYSTORE_PATH:-$CI_PROJECT_DIR/release.jks}"
      mkdir -p "$(dirname "$keystore_path")"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"

      # One version source for every release build: resolve the Play decision
      # (versionName from gradle/libs.versions.toml, versionCode from the Play
      # track) and inject it into gradle. play-release.env carries the same
      # numbers downstream so no job has to re-derive them.
      # Opt out with MAGISK_ANDROID_RELEASE_INJECT_VERSION=false.
      MAGISK_ANDROID_RELEASE_VERSION_ARGS=""
      if [[ "${MAGISK_ANDROID_RELEASE_INJECT_VERSION:-true}" == "true" ]]; then
        : "${MAGISK_ANDROID_RELEASE_PACKAGE_NAME:?MAGISK_ANDROID_RELEASE_PACKAGE_NAME is required to resolve the release version}"
        bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
          --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
          --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
          --output "$CI_PROJECT_DIR/play-release.env" \
          --initial-version-code "${MAGISK_PLAY_INITIAL_VERSION_CODE:-0}"
        set -a
        # shellcheck disable=SC1091
        . "$CI_PROJECT_DIR/play-release.env"
        set +a
        MAGISK_ANDROID_RELEASE_VERSION_ARGS="-PversionName=${MAGISK_PLAY_VERSION_NAME:-} -PversionCode=${MAGISK_PLAY_VERSION_CODE:-}"
      fi
      KEYSTORE_FILE="$keystore_path" \
      STORE_PASSWORD="$STORE_PASSWORD" \
      KEY_ALIAS="$KEY_ALIAS" \
      KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS $MAGISK_ANDROID_RELEASE_VERSION_ARGS $MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS $MAGISK_ANDROID_RELEASE_AAB_TASKS
  artifacts:
    name: "android-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - "*/build/outputs/bundle/**/*.aab"
      - "*/build/outputs/mapping/**/mapping.txt"
      - "*/build/outputs/native-debug-symbols/**/*.zip"
      - play-release.env

.magisk_android_gitlab_release:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_owner_rules
  stage: release
  variables:
    MAGISK_RELEASE_NOTES_FILE: "release-notes.md"
    MAGISK_GITLAB_RELEASE_PACKAGE_NAME: "android-release"
  script:
    - |
      set -euo pipefail
      : "${MAGISK_ANDROID_RELEASE_PACKAGE_NAME:?MAGISK_ANDROID_RELEASE_PACKAGE_NAME is required}"

      chmod +x "$MAGISK_CI_TOOLKIT_DIR/release/release_notes.sh" "$MAGISK_CI_TOOLKIT_DIR/release/gitlab_release.sh"
      release_notes_args=(
        --tag "$CI_COMMIT_TAG"
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME"
        --source-repo "${MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY:-}"
        --play-url "${MAGISK_ANDROID_RELEASE_PLAY_URL:-}"
        --gitlab-project-url "$CI_PROJECT_URL"
        --output "$MAGISK_RELEASE_NOTES_FILE"
      )
      if [[ "${MAGISK_ANDROID_RELEASE_SHOW_PLAY_LINK:-true}" != "true" ]]; then
        release_notes_args+=(--no-play-link)
      fi
      "$MAGISK_CI_TOOLKIT_DIR/release/release_notes.sh" "${release_notes_args[@]}"
      "$MAGISK_CI_TOOLKIT_DIR/release/gitlab_release.sh"

.magisk_android_publish_play:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_owner_rules
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true"'
    - when: never
  script:
    - |
      set -euo pipefail
      : "${MAGISK_ANDROID_RELEASE_PACKAGE_NAME:?MAGISK_ANDROID_RELEASE_PACKAGE_NAME is required}"
      : "${ANDROID_PUBLISHER_CREDENTIALS:?ANDROID_PUBLISHER_CREDENTIALS is required}"

      publisher_credentials_file="$(mktemp)"
      metadata_staging_dir=''
      chmod 0600 "$publisher_credentials_file"
      cleanup_publisher_credentials() {
        rm -f "$publisher_credentials_file"
        rm -rf "$metadata_staging_dir"
      }
      trap cleanup_publisher_credentials EXIT
      if printf '%s' "$ANDROID_PUBLISHER_CREDENTIALS" | grep -q '^[[:space:]]*{'; then
        printf '%s' "$ANDROID_PUBLISHER_CREDENTIALS" > "$publisher_credentials_file"
      elif ! printf '%s' "$ANDROID_PUBLISHER_CREDENTIALS" | base64 --decode > "$publisher_credentials_file" 2>/dev/null; then
        echo "ERROR: ANDROID_PUBLISHER_CREDENTIALS must be JSON or base64-encoded JSON" >&2
        exit 1
      fi
      if ! grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"' "$publisher_credentials_file"; then
        echo "ERROR: ANDROID_PUBLISHER_CREDENTIALS does not look like a service account JSON" >&2
        exit 1
      fi

      app_module="${MAGISK_ANDROID_APP_MODULE:-app}"
      aab_file="$(find "$app_module/build/outputs/bundle" -type f -name '*.aab' | sort | head -n 1)"
      if [ -z "$aab_file" ]; then
        echo "ERROR: no .aab found under $app_module/build/outputs/bundle" >&2
        exit 1
      fi
      mapping_file="$(find "$app_module/build/outputs/mapping" -type f -name mapping.txt | sort | head -n 1 || true)"
      symbols_file="$(find "$app_module/build/outputs/native-debug-symbols" -type f -name native-debug-symbols.zip | sort | head -n 1 || true)"
      if [[ -f "$CI_PROJECT_DIR/play-release.env" ]]; then
        # The build job owns the version decision; carry it into this publish job.
        set -a
        source "$CI_PROJECT_DIR/play-release.env"
        set +a
      else
        bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
          --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
          --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
          --output "$CI_PROJECT_DIR/play-release.env" \
          --initial-version-code "${MAGISK_PLAY_INITIAL_VERSION_CODE:-0}"
        set -a
        source "$CI_PROJECT_DIR/play-release.env"
        set +a
      fi

      # Review gate: skip the submission when the latest release on the target
      # track is still in review or waiting for a managed publish. The flag is
      # produced by resolve_play_release.sh (see play-release.env).
      if [[ "${MAGISK_PLAY_SKIP_RELEASE:-0}" == "1" ]]; then
        echo "SKIP_PLAY: track '${MAGISK_PLAY_TRACK}' latest release state='${MAGISK_PLAY_TRACK_STATUS:-unknown}' (in review / not live yet); skipping this submission to avoid review pile-up."
        exit 0
      fi

      release_track="$MAGISK_PLAY_TRACK"
      metadata_path=''
      for candidate in \
        "$CI_PROJECT_DIR/fastlane/metadata/android" \
        "$CI_PROJECT_DIR/metadata/android"; do
        if [[ -d "$candidate" ]]; then
          metadata_path="$candidate"
          break
        fi
      done

      # Fastlane/Ruby require an explicit UTF-8 locale in the slim image.
      export LANG=C.UTF-8
      export LC_ALL=C.UTF-8
      export LANGUAGE=C.UTF-8
      export FASTLANE_OPT_OUT_USAGE=1
      export DEBIAN_FRONTEND=noninteractive
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [[ "$use_mirror" == "true" ]]; then
        sed -i \
          -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
          -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      fi
      if [[ "$use_mirror" == "true" ]]; then
        if ! apt-get -o APT::Update::Error-Mode=any update; then
          echo "Mirror apt-get update failed, falling back to official sources" >&2
          sed -i \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get -o APT::Update::Error-Mode=any update
        fi
      else
        apt-get -o APT::Update::Error-Mode=any update
      fi
      apt-get install -y --no-install-recommends build-essential ruby ruby-dev
      rm -rf /var/lib/apt/lists/*
      gem_user_bin="$(ruby -r rubygems -e 'print Gem.user_dir')/bin"
      export PATH="$gem_user_bin:$PATH"
      gem install --user-install fastlane --no-document

      cmd=(
        fastlane supply
        --aab "$aab_file"
        --package_name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME"
        --track "$release_track"
        --release_status "completed"
        --json_key "$publisher_credentials_file"
        --skip_upload_images true
        --skip_upload_screenshots true
      )
      if [[ -n "$metadata_path" ]]; then
        metadata_staging_dir="$(mktemp -d)"
        cp -a "$metadata_path/." "$metadata_staging_dir/"
        version_file="$CI_PROJECT_DIR/gradle/libs.versions.toml"
        source_version_code=''
        if [[ -f "$version_file" ]]; then
          source_version_code="$(sed -nE 's/^versionCode[[:space:]]*=[[:space:]]*"([0-9]+)"/\1/p' "$version_file" | head -n 1)"
        fi
        if [[ -n "$source_version_code" && "$source_version_code" != "$MAGISK_PLAY_VERSION_CODE" ]]; then
          while IFS= read -r changelog_file; do
            locale_dir="$(dirname "$(dirname "$changelog_file")")"
            source_changelog="$locale_dir/changelogs/$source_version_code.txt"
            target_changelog="$locale_dir/changelogs/$MAGISK_PLAY_VERSION_CODE.txt"
            if [[ -f "$source_changelog" ]]; then
              cp "$source_changelog" "$target_changelog"
            fi
          done < <(find "$metadata_staging_dir" -type f -path '*/changelogs/*.txt' | sort -u)
        fi
        cmd+=(--metadata_path "$metadata_staging_dir" --skip_upload_metadata false)
      else
        cmd+=(--skip_upload_metadata true)
      fi
      if [ -n "$mapping_file" ] && [ -n "$symbols_file" ]; then
        cmd+=(--mapping_paths "${mapping_file},${symbols_file}")
      elif [ -n "$mapping_file" ]; then
        cmd+=(--mapping "$mapping_file")
      elif [ -n "$symbols_file" ]; then
        cmd+=(--mapping_paths "$symbols_file")
      fi

      FASTLANE_SKIP_UPDATE_CHECK=1 \
      FASTLANE_DISABLE_COLORS=1 \
      FASTLANE_OPT_OUT_USAGE=1 \
      CI=true \
        "${cmd[@]}"

      release_env_file="${MAGISK_RELEASE_ENV_FILE:-play-release-status.env}"
      {
        printf 'MAGISK_RELEASE_TRACK=%q\n' "$MAGISK_PLAY_TRACK"
        printf 'MAGISK_RELEASE_VERSION_NAME=%q\n' "$MAGISK_PLAY_VERSION_NAME"
        printf 'MAGISK_RELEASE_VERSION_CODE=%q\n' "$MAGISK_PLAY_VERSION_CODE"
        printf 'MAGISK_RELEASE_STATUS=published\n'
      } > "$release_env_file"

# Publishes the release into Xposed-Modules-Repo/<module>.
#
# Xposed-Modules-Repo expects "<versionCode>-<versionName>" release tags, so the
# channel tag is derived here instead of reusing the "v<versionName>" tag that
# the GitLab and GitHub releases use.
#
# Requires:
#   MAGISK_ANDROID_RELEASE_PACKAGE_NAME  (from the project .gitlab-ci.yml)
#   MAGISK_ANDROID_RELEASE_MODULES_REPO  (from the project .gitlab-ci.yml)
#   XPOSED_MODULES_REPO_TOKEN
# Optional:
#   MAGISK_ANDROID_RELEASE_MODULES_REPO_TAG           explicit release tag override
#   MAGISK_ANDROID_RELEASE_MODULES_REPO_VERSION_CODE  versionCode override
#   MAGISK_PLAY_INITIAL_VERSION_CODE                  floor for the derived versionCode

.magisk_android_publish_modules_repo:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_owner_rules
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_MODULES_REPO != ""'
    - when: never
  script:
    - |
      set -euo pipefail
      : "${MAGISK_ANDROID_RELEASE_PACKAGE_NAME:?MAGISK_ANDROID_RELEASE_PACKAGE_NAME is required}"
      : "${MAGISK_ANDROID_RELEASE_MODULES_REPO:?MAGISK_ANDROID_RELEASE_MODULES_REPO is required}"
      : "${XPOSED_MODULES_REPO_TOKEN:?XPOSED_MODULES_REPO_TOKEN is required}"

      apk_roots="${MAGISK_ANDROID_RELEASE_APK_ROOTS:-app/build/outputs/apk}"
      mapfile -d '' apk_files < <(
        for root in $apk_roots; do
          [ -d "$root" ] || continue
          find "$root" -type f -path '*/release/*.apk' -print0
        done | sort -z
      )
      if [ "${#apk_files[@]}" -eq 0 ]; then
        echo "ERROR: no release APK files found under: ${apk_roots}" >&2
        exit 1
      fi

      # Xposed-Modules-Repo tags every release "<versionCode>-<versionName>".
      # Prefer the versionCode that the apk job baked into the APKs and recorded
      # in play-release.env; otherwise fall back to the same git based derivation.
      modules_version_name="${CI_COMMIT_TAG#v}"
      modules_release_tag="${MAGISK_ANDROID_RELEASE_MODULES_REPO_TAG:-}"
      if [ -z "$modules_release_tag" ]; then
        modules_version_code="${MAGISK_ANDROID_RELEASE_MODULES_REPO_VERSION_CODE:-}"
        if [ -z "$modules_version_code" ] && [ -f play-release.env ]; then
          # shellcheck disable=SC1091
          . ./play-release.env
          modules_version_code="${MAGISK_PLAY_VERSION_CODE:-}"
          if [ -n "${MAGISK_PLAY_VERSION_NAME:-}" ]; then
            modules_version_name="$MAGISK_PLAY_VERSION_NAME"
          fi
        fi
        if [ -z "$modules_version_code" ]; then
          commit_count="$(git rev-list --first-parent --count HEAD 2>/dev/null || printf '0')"
          case "$commit_count" in
            ''|*[!0-9]*) commit_count=0 ;;
          esac
          modules_version_code=$((commit_count + 1))
          initial_code="${MAGISK_PLAY_INITIAL_VERSION_CODE:-0}"
          case "$initial_code" in
            ''|*[!0-9]*) initial_code=0 ;;
          esac
          if [ "$initial_code" -gt 0 ] && [ "$modules_version_code" -le "$initial_code" ]; then
            modules_version_code=$((initial_code + 1))
          fi
        fi
        modules_release_tag="${modules_version_code}-${modules_version_name}"
      fi
      echo "Xposed-Modules-Repo release tag: ${modules_release_tag} (pipeline tag ${CI_COMMIT_TAG})"

      install -d -m 0755 /etc/apt/keyrings
      export DEBIAN_FRONTEND=noninteractive
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [[ "$use_mirror" == "true" ]]; then
        sed -i \
          -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
          -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
          -e 's#http://archive.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          -e 's#http://security.ubuntu.com/ubuntu#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      fi
      if [[ "$use_mirror" == "true" ]]; then
        if ! apt-get -o APT::Update::Error-Mode=any update; then
          echo "Mirror apt-get update failed, falling back to official sources" >&2
          sed -i \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian-security#http://deb.debian.org/debian-security#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/debian#http://deb.debian.org/debian#g' \
            -e 's#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get -o APT::Update::Error-Mode=any update
        fi
      else
        apt-get -o APT::Update::Error-Mode=any update
      fi
      apt-get install -y --no-install-recommends gpg
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        > /etc/apt/sources.list.d/github-cli.list
      apt-get -o APT::Update::Error-Mode=any update
      apt-get install -y --no-install-recommends gh
      rm -rf /var/lib/apt/lists/*

      chmod +x "$MAGISK_CI_TOOLKIT_DIR/release/release_notes.sh"
      # Keep the channel badge row identical on every release surface: the
      # GitLab release and the GitHub release already pass --play-url and
      # --gitlab-project-url, so the modules-repo release must too, otherwise
      # it renders a one-badge page while the others render three.
      GH_TOKEN="$XPOSED_MODULES_REPO_TOKEN" \
        "$MAGISK_CI_TOOLKIT_DIR/release/release_notes.sh" \
          --tag "$CI_COMMIT_TAG" \
          --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
          --source-repo "${MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY:-}" \
          --play-url "${MAGISK_ANDROID_RELEASE_PLAY_URL:-}" \
          --gitlab-project-url "$CI_PROJECT_URL" \
          --generate-github-notes \
          --output release-notes.md
      export GH_TOKEN="$XPOSED_MODULES_REPO_TOKEN"

      if gh release view "$modules_release_tag" --repo "$MAGISK_ANDROID_RELEASE_MODULES_REPO" >/dev/null 2>&1; then
        gh release upload "$modules_release_tag" "${apk_files[@]}" \
          --repo "$MAGISK_ANDROID_RELEASE_MODULES_REPO" \
          --clobber
        gh release edit "$modules_release_tag" \
          --repo "$MAGISK_ANDROID_RELEASE_MODULES_REPO" \
          --title "v${modules_version_name}" \
          --draft=false \
          --notes-file release-notes.md
      else
        gh release create "$modules_release_tag" "${apk_files[@]}" \
          --repo "$MAGISK_ANDROID_RELEASE_MODULES_REPO" \
          --title "v${modules_version_name}" \
          --notes-file release-notes.md
      fi

# Publish the GitHub Release for a tag, driven from the GitLab pipeline.
#
# This is the "release owner stays on GitLab" path: GitLab CI builds and publishes
# its own release, then mirrors the release (tag + notes + APK assets) to GitHub.
# GitHub Actions is expected to be disabled for the repository, so this job is the
# only thing that creates the GitHub Release.
#
# Requires:
#   MAGISK_ANDROID_RELEASE_PACKAGE_NAME  (from the project .gitlab-ci.yml)
#   GITHUB_RELEASE_TOKEN                 (repo scope; can be GH_PAT)
# Optional:
#   MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY   "<owner>/<repo>", default "<GITHUB_OWNER>/<CI_PROJECT_NAME>"
#   MAGISK_GITHUB_RELEASE_OWNER                owner used when the repository is not set, default "magisk317"
#   MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN  default "*arm64-v8a*.apk"
#   MAGISK_ANDROID_RELEASE_GITHUB_RELEASE_NOTES  "false" to skip notes generation
.magisk_android_release_github:
  extends:
    - .magisk_linux_base
    - .magisk_android_release_owner_rules
  stage: release
  variables:
    MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN: "*arm64-v8a*.apk"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab" && $GITHUB_RELEASE_TOKEN != ""'
    - when: never
  script:
    - |
      set -euo pipefail
      : "${MAGISK_ANDROID_RELEASE_PACKAGE_NAME:?MAGISK_ANDROID_RELEASE_PACKAGE_NAME is required}"
      : "${GITHUB_RELEASE_TOKEN:?GITHUB_RELEASE_TOKEN is required}"

      github_repo="${MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY:-}"
      if [[ -z "$github_repo" ]]; then
        github_repo="${MAGISK_GITHUB_RELEASE_OWNER:-magisk317}/${CI_PROJECT_NAME}"
      fi

      find_apks() {
        local pattern="$1"
        local root
        for root in ${MAGISK_ANDROID_RELEASE_APK_ROOTS:-app/build/outputs/apk}; do
          [ -d "$root" ] || continue
          find "$root" -type f -name "$pattern" -path '*/release/*' -print
        done | sort
      }

      mapfile -t apk_files < <(find_apks "${MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN}")
      if [[ "${#apk_files[@]}" -eq 0 ]]; then
        echo "ERROR: no release APKs matched '${MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN}' under: ${MAGISK_ANDROID_RELEASE_APK_ROOTS:-app/build/outputs/apk}" >&2
        exit 1
      fi
      echo "Publishing ${#apk_files[@]} asset(s) to ${github_repo}"

      install -d -m 0755 /etc/apt/keyrings
      export DEBIAN_FRONTEND=noninteractive
      apt-get -o APT::Update::Error-Mode=any update
      apt-get install -y --no-install-recommends curl ca-certificates gpg
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        > /etc/apt/sources.list.d/github-cli.list
      apt-get -o APT::Update::Error-Mode=any update
      apt-get install -y --no-install-recommends gh
      rm -rf /var/lib/apt/lists/*

      chmod +x "$MAGISK_CI_TOOLKIT_DIR/release/release_notes.sh"
      export GH_TOKEN="$GITHUB_RELEASE_TOKEN"

      notes_file="release-notes-github.md"
      MAGISK_RELEASE_PLATFORM=github \
        "$MAGISK_CI_TOOLKIT_DIR/release/release_notes.sh" \
          --tag "$CI_COMMIT_TAG" \
          --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
          --source-repo "$github_repo" \
          --play-url "${MAGISK_ANDROID_RELEASE_PLAY_URL:-}" \
          --gitlab-project-url "$CI_PROJECT_URL" \
          --generate-github-notes \
          --output "$notes_file"

      if gh release view "$CI_COMMIT_TAG" --repo "$github_repo" >/dev/null 2>&1; then
        gh release upload "$CI_COMMIT_TAG" "${apk_files[@]}" \
          --repo "$github_repo" \
          --clobber
        gh release edit "$CI_COMMIT_TAG" \
          --repo "$github_repo" \
          --title "$CI_COMMIT_TAG" \
          --draft=false \
          --notes-file "$notes_file"
      else
        gh release create "$CI_COMMIT_TAG" "${apk_files[@]}" \
          --repo "$github_repo" \
          --title "$CI_COMMIT_TAG" \
          --notes-file "$notes_file"
      fi

      echo "GitHub release ready: https://github.com/${github_repo}/releases/tag/${CI_COMMIT_TAG}"


# ---------------------------------------------------------------------------
# Deprecated. Version resolution + injection now lives in both release
# templates (MAGISK_ANDROID_RELEASE_INJECT_VERSION), so this anchor is a plain
# alias kept for consumers that still extend it.
# ---------------------------------------------------------------------------
.magisk_android_release_apk_play_env:
  extends: .magisk_android_release_apk
