# Consumers opt in by extending .magisk_cancel_older_mr_pipelines. The
# protected controller handles MR/push cleanup and Renovate pipeline
# coordination. Renovate schedule/web/API pipelines use latest-wins so only
# one serial Renovate orchestrator remains active for a branch.
#
# One wrong character here silently disables the feature: GitLab expands
# unknown predefined variables to an empty string, and the controller
# cannot cancel what it cannot name. The MR source branch variable is
# CI_MERGE_REQUEST_SOURCE_BRANCH_NAME (there is no _NAME-less
# CI_MERGE_REQUEST_SOURCE_BRANCH); ci/tests/test_ci_predefined_variables.sh
# guards every referenced predefined variable name.
# Cross-family cancellation: MR pipelines additionally pass their source
# branch so the controller can cancel the sibling push pipeline of the same
# branch. Renovate pushes a branch before opening the MR, so the workflow rule
# that suppresses push pipelines on MRs loses the race and both pipelines
# exist for the same commit; on a single-contested runner that duplicate
# build starves the MR feedback job. The MR pipeline is the review gate, so
# the cancellation direction is MR -> push only, never the reverse.
#
# Post-merge cleanup (opt-in with MAGISK_CANCEL_MERGED_MR_PIPELINES=true):
# a merge that lands on the protected target branch starts a new push
# pipeline, and native auto-cancel:on_new_commit only ever fires on the
# pushed ref. The merged MR's own merge_request_event pipeline sits on a ref
# that receives no further pipeline, so it runs to completion against already
# merged code. The push pipeline therefore asks the controller to cancel the
# merge_request_event pipelines of the merge requests merged just before it
# was created, closing that gap within seconds of the merge.

.magisk_cancel_older_mr_pipelines:
  stage: .pre
  interruptible: true
  allow_failure: true
  rules:
    - if: '$MAGISK_CANCEL_OLDER_MR_PIPELINES == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        MAGISK_UPSTREAM_REF: "$CI_MERGE_REQUEST_REF_PATH"
        MAGISK_UPSTREAM_SOURCE_BRANCH: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        MAGISK_TRIGGER_PIPELINE_KIND: "mr_or_push"
    - if: '$MAGISK_CANCEL_OLDER_MR_PIPELINES == "true" && $CI_PIPELINE_SOURCE == "push"'
      variables:
        MAGISK_UPSTREAM_REF: "$CI_COMMIT_REF_NAME"
        MAGISK_TRIGGER_PIPELINE_KIND: "mr_or_push"
    - if: '$MAGISK_CANCEL_OLDER_MR_PIPELINES == "true" && $CI_PIPELINE_SOURCE == "schedule"'
      variables:
        MAGISK_UPSTREAM_REF: "$CI_COMMIT_REF_NAME"
        MAGISK_TRIGGER_PIPELINE_KIND: "renovate"
    - if: '$MAGISK_CANCEL_OLDER_MR_PIPELINES == "true" && $DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      variables:
        MAGISK_UPSTREAM_REF: "$CI_COMMIT_REF_NAME"
        MAGISK_TRIGGER_PIPELINE_KIND: "renovate"
    - if: '$MAGISK_CANCEL_OLDER_MR_PIPELINES == "true" && $DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      variables:
        MAGISK_UPSTREAM_REF: "$CI_COMMIT_REF_NAME"
        MAGISK_TRIGGER_PIPELINE_KIND: "renovate"
    - when: never
  trigger:
    project: magisk3171/shared/magisk-ci-toolkit
    branch: main
    strategy: depend
  variables:
    MAGISK_UPSTREAM_PROJECT_ID: "$CI_PROJECT_ID"
    MAGISK_UPSTREAM_PROJECT_PATH: "$CI_PROJECT_PATH"
    MAGISK_UPSTREAM_PIPELINE_ID: "$CI_PIPELINE_ID"
    MAGISK_UPSTREAM_PIPELINE_IID: "$CI_PIPELINE_IID"
    MAGISK_UPSTREAM_PIPELINE_SOURCE: "$CI_PIPELINE_SOURCE"
    MAGISK_UPSTREAM_PIPELINE_KIND: "$MAGISK_TRIGGER_PIPELINE_KIND"
    MAGISK_CANCEL_MERGED_MR_PIPELINES: "$MAGISK_CANCEL_MERGED_MR_PIPELINES"
