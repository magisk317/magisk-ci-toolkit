# Shared Bun frontend jobs. Consumers keep project-specific checkout and build
# commands, while this template owns the runtime, cache, and Bun pin handling.

.magisk_frontend_bun:
  image: "$MAGISK_FRONTEND_BUN_IMAGE"
  variables:
    MAGISK_FRONTEND_BUN_IMAGE: "oven/bun:1.4-alpine"
    BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
    BUN_CONFIG_REGISTRY: "https://registry.npmjs.org"
  cache:
    key: "magisk-frontend-bun-$CI_PROJECT_ID-$CI_COMMIT_REF_SLUG"
    paths:
      - .bun-cache/
  before_script:
    - |
      if command -v apk >/dev/null 2>&1; then
        apk add --no-cache bash ca-certificates git
      fi
    - |
      if [ -z "${MAGISK_CI_TOOLKIT_DIR:-}" ]; then
        if [[ ! -x scripts/resolve_ci_toolkit.sh ]]; then
          echo "MAGISK_CI_TOOLKIT_DIR is unset and scripts/resolve_ci_toolkit.sh is missing" >&2
          exit 1
        fi
        export MAGISK_CI_TOOLKIT_DIR="$(bash scripts/resolve_ci_toolkit.sh)"
      fi
      export MAGISK_CI_TOOLKIT_DIR
      bash "$MAGISK_CI_TOOLKIT_DIR/ci/ensure_bun.sh" "${MAGISK_FRONTEND_PACKAGE_JSON:-package.json}"

.magisk_frontend_build:
  extends: .magisk_frontend_bun
  script:
    - bash "$MAGISK_CI_TOOLKIT_DIR/ci/frontend_build.sh"
  artifacts:
    when: always
    paths:
      - "$MAGISK_FRONTEND_DIST_DIR/"
