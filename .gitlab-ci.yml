workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

default:
  interruptible: true

stages:
  - test
  - control

shell:test:
  image: alpine:3.22
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "pipeline"'
    - when: never
  before_script:
    - apk add --no-cache bash curl jq shellcheck
  script:
    - bash -n ci/*.sh ci/tests/*.sh
    - >-
      shellcheck -x
      ci/cancel_older_mr_pipelines.sh
      ci/cancel_older_renovate_pipelines.sh
      ci/auto_merge_upstream_mr.sh
      ci/renovate_serial_loop.sh
      ci/tests/test_cancel_older_mr_pipelines.sh
      ci/tests/test_cancel_older_renovate_pipelines.sh
      ci/tests/test_auto_merge_upstream_mr.sh
      ci/tests/test_renovate_serial_loop.sh
    - bash ci/tests/test_cancel_older_mr_pipelines.sh
    - bash ci/tests/test_cancel_older_renovate_pipelines.sh
    - bash ci/tests/test_auto_merge_upstream_mr.sh
    - bash ci/tests/test_renovate_serial_loop.sh

cancel:older:mr:pipelines:
  image: alpine:3.22
  stage: control
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - when: never
  before_script:
    - apk add --no-cache bash curl jq
  script:
    # MR merge is independent of pipeline state. Cancellation is a best-effort
    # cleanup for the same MR/ref and must never veto a successful merge.
    - |
      set -euo pipefail
      merge_status=0
      cancel_status=0
      if [[ "${MAGISK_UPSTREAM_PIPELINE_SOURCE}" == "merge_request_event" ]]; then
        bash ci/auto_merge_upstream_mr.sh || merge_status=$?
      fi
      if [[ "${MAGISK_UPSTREAM_PIPELINE_KIND:-mr_or_push}" == "renovate" ]]; then
        bash ci/cancel_older_renovate_pipelines.sh || cancel_status=$?
      else
        bash ci/cancel_older_mr_pipelines.sh || cancel_status=$?
      fi
      if ((cancel_status != 0)); then
        echo "Warning: pipeline cleanup failed; MR merge result is unaffected." >&2
      fi
      exit "$merge_status"
