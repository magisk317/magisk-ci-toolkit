workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Scheduled pipelines exist solely to run this repository's own Renovate
    # (see the renovate:gitlab job and .gitlab/renovate.json below).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

default:
  interruptible: true
  # Route every job to the self-hosted group runners (magisk3171 group).
  # Shared GitLab.com SaaS runners are disabled on this project. These jobs are
  # alpine-based and architecture-agnostic, so they run on the amd64 runner.
  tags:
    - magisk-amd64-linux

include:
  # Local include (not a project reference) so the GitLab CI manager follows
  # this snippet when scanning for dependency updates: it keeps the
  # renovate/renovate image pin in the shared Renovate template up to date.
  - local: /.gitlab/ci/renovate.yml
  # Local include of the trusted controller template. Consumers
  # (MiPush, NapGram, ...) reference the same anchor through their own
  # pipelines and their bridges target this repository; including it here
  # keeps the downstream controller job (cancel:older:mr:pipelines) in sync
  # for those bridges. This repository cannot bridge into itself, so its own
  # merge requests are handled by renovate:self-automerge below.
  - local: /.gitlab/ci/cancel-mr-pipelines.yml
  # Local include of the utility-job anchor. Consumers reference the same
  # anchor through their own pipelines (sync:github, bundle refreshers, ...);
  # this repository's own alpine jobs extend it below.
  - local: /.gitlab/ci/utility.yml
  # Local include of the GitHub redundancy-mirror anchor. Consumers reference
  # .magisk_github_sync through their own pipelines; including it here keeps
  # this repository's own default branch mirrored with the same rules the
  # consumers get, instead of a hand-copied job that can drift.
  - local: /.gitlab/ci/github-sync.yml

stages:
  - test
  - maintenance
  - control
  - sync

shell:test:
  extends: .magisk_utility_base
  stage: test
  rules:
    # Scheduled pipelines only run Renovate; a daily test-suite run is noise.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "pipeline"'
    - when: never
  # All utilities (bash, curl, jq, git, python3, openssl, shellcheck) are pre-baked
  # into .magisk_utility_base. No runtime apk add is required.
  script:
    - bash -n ci/*.sh ci/tests/*.sh gradle/*.sh gradle/tests/*.sh release/*.sh release/tests/*.sh
    - >-
      shellcheck -x
      ci/cancel_older_mr_pipelines.sh
      ci/cancel_older_renovate_pipelines.sh
      ci/cancel_merged_mr_pipelines.sh
      ci/allocate_version_code.sh
      ci/allocated_version_code.sh
      ci/auto_merge_upstream_mr.sh
      ci/auto_merge_self_renovate_mrs.sh
      ci/reconcile_trusted_renovate_mrs.sh
      ci/renovate_serial_loop.sh
      gradle/run_gradle_with_retry.sh
      ci/tests/test_cancel_older_mr_pipelines.sh
      ci/tests/test_cancel_older_renovate_pipelines.sh
      ci/tests/test_cancel_merged_mr_pipelines.sh
      ci/tests/test_allocate_version_code.sh
      ci/tests/test_allocated_version_code.sh
      ci/tests/test_ci_predefined_variables.sh
      ci/tests/test_auto_merge_upstream_mr.sh
      ci/tests/test_auto_merge_self_renovate_mrs.sh
      ci/tests/test_reconcile_trusted_renovate_mrs.sh
      ci/tests/test_reconcile_github_refs.sh
      ci/tests/test_renovate_serial_loop.sh
      ci/tests/test_gitlab_telegram_release.sh
      ci/tests/test_github_sync_template.sh
      ci/tests/test_linux_release_template.sh
      ci/tests/test_resolve_git_checkout.sh
      ci/verify_toolkit_pin.sh
      ci/tests/test_verify_toolkit_pin.sh
      ci/tests/test_github_release_template.sh
      gradle/tests/test_run_gradle_with_retry.sh
      gradle/tests/test_build_guard_drift.sh
      release/reconcile_github_refs.sh
      release/tests/test_release_notes.sh
      release/tests/test_modules_repo_tag.sh
      release/tests/test_release_tag.sh
      release/tests/test_check_release_guard.sh
      ci/tests/test_trusted_projects.sh
    - bash ci/tests/test_cancel_older_mr_pipelines.sh
    - bash ci/tests/test_cancel_older_renovate_pipelines.sh
    - bash ci/tests/test_cancel_merged_mr_pipelines.sh
    - bash ci/tests/test_ci_predefined_variables.sh
    - bash ci/tests/test_auto_merge_upstream_mr.sh
    - bash ci/tests/test_auto_merge_self_renovate_mrs.sh
    - bash ci/tests/test_reconcile_trusted_renovate_mrs.sh
    - bash ci/tests/test_reconcile_github_refs.sh
    - bash ci/tests/test_renovate_serial_loop.sh
    - bash ci/tests/test_gitlab_telegram_release.sh
    - bash ci/tests/test_linux_release_template.sh
    - bash gradle/tests/test_run_gradle_with_retry.sh
    - bash gradle/tests/test_build_guard_drift.sh
    - bash ci/tests/test_allocate_version_code.sh
    - bash ci/tests/test_allocated_version_code.sh
    - bash release/tests/test_release_notes.sh
    - bash release/tests/test_modules_repo_tag.sh
    - bash release/tests/test_release_tag.sh
    - bash release/tests/test_check_release_guard.sh
    - bash ci/tests/test_trusted_projects.sh
    - bash ci/tests/test_github_sync_template.sh
    - bash ci/tests/test_resolve_git_checkout.sh
    - bash ci/tests/test_verify_toolkit_pin.sh
    - bash ci/tests/test_github_release_template.sh

# Redundancy mirror of this repository to GitHub.
sync:github:
  extends: .magisk_github_sync
  variables:
    MAGISK_GITHUB_MIRROR_REPOSITORY: "magisk317/magisk-ci-toolkit"

# Self-Renovate: run the shared serial orchestrator against this repository on
# a schedule. Consumers reuse the same template with their repository and
# the pinned toolkit SHA; here the loop runs from the default branch.
renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: false
  stage: maintenance
  # The renovate image runs as a non-root uid, so it cannot create the
  # per-project /opt/gradle-cache directory that the amd64 runner's pre-build
  # script prepares for Android builds. The arm64 group runner runs the same
  # pre-build successfully for the same image (see NapGram's renovate:gitlab),
  # so this job is pinned there.
  tags:
    - magisk-arm64-linux
  # The high-frequency reconcile schedule (MAGISK_RENOVATE_RECONCILE=true,
  # see renovate:reconcile below) must not also run the daily serial
  # orchestrator: these pipelines exist for the merge sweep alone.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MAGISK_RENOVATE_RECONCILE != "true"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web" && $MAGISK_RENOVATE_RECONCILE != "true"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api" && $MAGISK_RENOVATE_RECONCILE != "true"'
    - when: never
  variables:
    MAGISK_RENOVATE_REPOSITORY: "magisk3171/shared/magisk-ci-toolkit"
    MAGISK_RENOVATE_PLATFORM_AUTOMERGE: "false"
    MAGISK_RENOVATE_IGNORE_TESTS: "true"
    # ci/renovate_serial_loop.sh hard requirement: obsolete Renovate pipelines
    # must be cancellable so a single orchestrator survives its own merge.
    # Consumers get that cancellation from the renovate bridge kind; this
    # repository performs it in renovate:self-automerge below.
    MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
    # Consumers pin one exact toolkit SHA; the toolkit drives its own loop from main.
    MAGISK_CI_TOOLKIT_REF: "main"
    # Renovate skips github-tags/github-releases deps when no GitHub token is
    # present. GITHUB_PAT is a protected group variable; this job runs on the
    # protected default branch, so it is available here.
    GITHUB_TOKEN: "$GITHUB_PAT"

# Self-Renovate auto-merge: a multi-project bridge cannot target the project
# its own pipeline runs in (probe-verified on this instance: a self trigger is
# rejected as an invalid bridge trigger, the pipeline create API refuses the
# CI job token, and a child pipeline inherits the unprotected merge request
# ref, where the masked merge token is unavailable), so this repository has no
# bridge-side controller for its own merge requests. The serial Renovate
# pipeline already runs on the protected default branch, where
# MAGISK_CI_MR_AUTOMERGE_TOKEN is available: this job merges the requests
# Renovate opens with the same validation and sha pinning as the consumer
# controller, and performs the latest-wins cancellation consumers receive
# from the renovate bridge kind. Each merge request still runs its own
# pipeline, and every merge commit is guarded by shell:test on the resulting
# push pipeline.
renovate:self-automerge:
  extends: .magisk_utility_base
  stage: maintenance
  interruptible: false
  needs: []
  # One dropped TLS connection during get_sources must not silently skip the
  # merge of this repository's own Renovate MRs for a day (the api_retry
  # ladder protects script-internal API calls, not the runner's git fetch).
  retry:
    max: 2
  # Pin to the arm64 runner: it egresses directly to gitlab.com (Oracle host,
  # overseas) instead of through the shared clash proxy the amd64 runner
  # depends on, whose transient TLS errors killed controller jobs on
  # 2026-10-14 and 2026-10-18.
  tags:
    - magisk-arm64-linux
  script:
    - bash ci/auto_merge_self_renovate_mrs.sh
  rules:
    # Same source contract as the serial loop in renovate:gitlab, with the
    # same reconcile-schedule exclusion.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MAGISK_RENOVATE_RECONCILE != "true"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web" && $MAGISK_RENOVATE_RECONCILE != "true"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api" && $MAGISK_RENOVATE_RECONCILE != "true"'
    - when: never

# Reconcile sweep: the serial loop and the consumer controller each merge one
# request per trigger, and both can leave a request unmerged when their
# trigger dies - a dropped TLS connection during get_sources (2026-10-18), or
# GitLab's post-rebase merge_status recheck window answering 422 to all six
# controller merge attempts (2026-10-19, build-logic !21). The high-frequency
# reconcile schedule (MAGISK_RENOVATE_RECONCILE=true, every 15 minutes) runs
# this sweep across every trusted project plus this repository and merges the
# requests GitLab already reports as can_be_merged; everything else waits for
# the next sweep or the daily orchestrator. The variable keeps the daily
# renovate:gitlab and renovate:self-automerge jobs out of these pipelines.
renovate:reconcile:
  extends: .magisk_utility_base
  stage: maintenance
  # The sweep merges other projects' merge requests mid-flight; a push to main
  # must not cancel it between a validated request and its merge.
  interruptible: false
  needs: []
  # Same transport hardening as the controller jobs: one dropped connection
  # during get_sources must not skip a sweep (the api_retry ladder protects
  # script-internal API calls, not the runner's git fetch).
  retry:
    max: 2
  # Pin to the arm64 runner: direct Oracle egress to gitlab.com (see
  # renovate:self-automerge).
  tags:
    - magisk-arm64-linux
  script:
    - bash ci/reconcile_trusted_renovate_mrs.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MAGISK_RENOVATE_RECONCILE == "true"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web" && $MAGISK_RENOVATE_RECONCILE == "true"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api" && $MAGISK_RENOVATE_RECONCILE == "true"'
    - when: never

cancel:older:mr:pipelines:
  extends: .magisk_utility_base
  stage: control
  interruptible: true
  # The controller merge/cleanup must survive transient TLS drops between the
  # runner and gitlab.com: on 2026-10-18 a dropped connection during this
  # job's git fetch killed it before any script ran, leaving the upstream
  # Renovate MR unmerged and timing out the upstream serial loop. The ci
  # scripts already retry API calls via api_retry.sh; get_sources does not.
  retry:
    max: 2
  # Pin to the arm64 runner (direct Oracle egress; see renovate:self-automerge).
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - when: never
  script:
    # MR merge is independent of pipeline state. Cancellation is a best-effort
    # cleanup for the same MR/ref and must never veto a successful merge.
    - |
      set -euo pipefail
      merge_status=0
      cancel_status=0
      merged_cancel_status=0
      if [ "${MAGISK_UPSTREAM_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        bash ci/auto_merge_upstream_mr.sh || merge_status=$?
      fi
      if [ "${MAGISK_UPSTREAM_PIPELINE_KIND:-mr_or_push}" = "renovate" ]; then
        bash ci/cancel_older_renovate_pipelines.sh || cancel_status=$?
      else
        bash ci/cancel_older_mr_pipelines.sh || cancel_status=$?
      fi
      if [ "$cancel_status" -ne 0 ]; then
        echo "Warning: pipeline cleanup failed; MR merge result is unaffected." >&2
      fi
      # Native auto-cancel never fires for a merged MR's own pipeline: its
      # ref receives no new pipeline after the merge, so that pipeline runs to
      # completion against merged code. Consumers opt in per push pipeline
      # with MAGISK_CANCEL_MERGED_MR_PIPELINES=true.
      if [ "${MAGISK_CANCEL_MERGED_MR_PIPELINES:-}" = "true" ]; then
        bash ci/cancel_merged_mr_pipelines.sh || merged_cancel_status=$?
      fi
      if [ "$merged_cancel_status" -ne 0 ]; then
        echo "Warning: post-merge MR pipeline cleanup failed; the merge result is unaffected." >&2
      fi
      exit "$merge_status"
