workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Scheduled pipelines exist solely to run this repository's own Renovate
    # (see the renovate:gitlab job and .gitlab/renovate.json below).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

default:
  interruptible: true
  # Route every job to the self-hosted group runners (magisk3171 group).
  # Shared GitLab.com SaaS runners are disabled on this project. These jobs are
  # alpine-based and architecture-agnostic, so they run on the amd64 runner.
  tags:
    - magisk-amd64-linux

include:
  # Local include (not a project reference) so the GitLab CI manager follows
  # this snippet when scanning for dependency updates: it keeps the
  # renovate/renovate image pin in the shared Renovate template up to date.
  - local: /.gitlab/ci/renovate.yml

stages:
  - test
  - maintenance
  - control

shell:test:
  image: alpine:3.22
  stage: test
  rules:
    # Scheduled pipelines only run Renovate; a daily test-suite run is noise.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "pipeline"'
    - when: never
  before_script:
    - apk add --no-cache bash curl jq shellcheck python3 openssl git
  script:
    - bash -n ci/*.sh ci/tests/*.sh gradle/*.sh gradle/tests/*.sh release/tests/*.sh
    - >-
      shellcheck -x
      ci/cancel_older_mr_pipelines.sh
      ci/cancel_older_renovate_pipelines.sh
      ci/auto_merge_upstream_mr.sh
      ci/renovate_serial_loop.sh
      gradle/run_gradle_with_retry.sh
      ci/tests/test_cancel_older_mr_pipelines.sh
      ci/tests/test_cancel_older_renovate_pipelines.sh
      ci/tests/test_auto_merge_upstream_mr.sh
      ci/tests/test_renovate_serial_loop.sh
      ci/tests/test_gitlab_telegram_release.sh
      ci/tests/test_linux_release_template.sh
      gradle/tests/test_run_gradle_with_retry.sh
      release/tests/test_release_notes.sh
      release/tests/test_modules_repo_tag.sh
    - bash ci/tests/test_cancel_older_mr_pipelines.sh
    - bash ci/tests/test_cancel_older_renovate_pipelines.sh
    - bash ci/tests/test_auto_merge_upstream_mr.sh
    - bash ci/tests/test_renovate_serial_loop.sh
    - bash ci/tests/test_gitlab_telegram_release.sh
    - bash ci/tests/test_linux_release_template.sh
    - bash gradle/tests/test_run_gradle_with_retry.sh
    - bash release/tests/test_release_notes.sh
    - bash release/tests/test_modules_repo_tag.sh

# Self-Renovate: run the shared serial orchestrator against this repository on
# a schedule. Consumers reuse the same template with their own repository and
# the pinned v1 toolkit ref; here the loop runs from the default branch.
renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: false
  stage: maintenance
  # The renovate image runs as a non-root uid, so it cannot create the
  # per-project /opt/gradle-cache directory that the amd64 runner's pre-build
  # script prepares for Android builds. The arm64 group runner runs the same
  # pre-build successfully for the same image (see NapGram's renovate:gitlab),
  # so this job is pinned there.
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_RENOVATE_REPOSITORY: "magisk3171/shared/magisk-ci-toolkit"
    MAGISK_RENOVATE_PLATFORM_AUTOMERGE: "false"
    MAGISK_RENOVATE_IGNORE_TESTS: "true"
    # ci/renovate_serial_loop.sh hard requirement: obsolete MR pipelines must
    # be cancellable so a single orchestrator survives its own merge.
    MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
    # Consumers pin the moving v1 tag; the toolkit drives its own loop from main.
    MAGISK_CI_TOOLKIT_REF: "main"

cancel:older:mr:pipelines:
  image: alpine:3.22
  stage: control
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - when: never
  before_script:
    - apk add --no-cache bash curl jq
  script:
    # MR merge is independent of pipeline state. Cancellation is a best-effort
    # cleanup for the same MR/ref and must never veto a successful merge.
    - |
      set -euo pipefail
      merge_status=0
      cancel_status=0
      if [[ "${MAGISK_UPSTREAM_PIPELINE_SOURCE}" == "merge_request_event" ]]; then
        bash ci/auto_merge_upstream_mr.sh || merge_status=$?
      fi
      if [[ "${MAGISK_UPSTREAM_PIPELINE_KIND:-mr_or_push}" == "renovate" ]]; then
        bash ci/cancel_older_renovate_pipelines.sh || cancel_status=$?
      else
        bash ci/cancel_older_mr_pipelines.sh || cancel_status=$?
      fi
      if ((cancel_status != 0)); then
        echo "Warning: pipeline cleanup failed; MR merge result is unaffected." >&2
      fi
      exit "$merge_status"
