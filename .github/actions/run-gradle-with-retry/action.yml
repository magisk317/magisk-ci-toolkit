name: 'Run Gradle with Retry'
description: 'Run Gradle through the shared transient-network retry wrapper'

inputs:
  arguments:
    description: 'Arguments passed to Gradle'
    required: true
  gradlew:
    description: 'Gradle wrapper path'
    required: false
    default: './gradlew'
  max-attempts:
    description: 'Maximum Gradle attempts'
    required: false
    default: '3'
  sleep-seconds:
    description: 'Delay between retry attempts'
    required: false
    default: '5'
  working-directory:
    description: 'Directory where Gradle should run'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Run Gradle
      shell: bash
      env:
        GRADLEW_BIN: ${{ inputs.gradlew }}
        GRADLE_RETRY_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        GRADLE_RETRY_SLEEP_SECONDS: ${{ inputs.sleep-seconds }}
      run: |
        set -euo pipefail
        cd "${{ inputs.working-directory }}"
        bash "${GITHUB_ACTION_PATH}/../../../gradle/run_gradle_with_retry.sh" ${{ inputs.arguments }}
