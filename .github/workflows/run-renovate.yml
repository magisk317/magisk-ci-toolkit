name: Run Renovate

on:
  workflow_call:
    inputs:
      base_branch:
        description: 'Base branch for Renovate'
        type: string
        default: 'beta'
      config_file:
        description: 'Path to Renovate config file'
        type: string
        default: '.github/renovate-config.js'
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.15
        with:
          configurationFile: ${{ inputs.config_file }}
          token: ${{ secrets.GH_PAT }}

      - name: Cleanup orphan renovate branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "Checking for orphan renovate branches..."

          # Configure git authentication
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          # List all remote branches starting with renovate/
          branches=$(git ls-remote --heads origin | awk '{print $2}' | grep 'refs/heads/renovate/' || true)

          if [[ -z "$branches" ]]; then
            echo "No renovate branches found."
            exit 0
          fi

          for branch in $branches; do
            branch_name=${branch#refs/heads/}
            echo "Checking branch: $branch_name"

            # Check if there is an open PR for this branch
            if ! gh pr list --head "$branch_name" --state open --json number --jq '.[].number' | grep -q .; then
              echo "Deleting orphan branch: $branch_name"
              git push origin --delete "$branch_name" || echo "Failed to delete $branch_name (may already be deleted)"
            else
              echo "Branch $branch_name has an open PR, skipping."
            fi
          done

          echo "Orphan branch cleanup completed."
